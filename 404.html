<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Adopt a Dataset</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F0; --card:#FFFDF9; --surface:#F5EDE0; --text:#3D2B1F; --muted:#6B5F54;
  --accent:#2D6A4F; --accent-hover:#245A42; --on-accent:#FFFFFF; --highlight:#D4A03C; --border:#E8DDD0;
  --chip-g-bg:#DDEFE5; --chip-g-fg:#1E4D38; --chip-a-bg:#F6E7C1; --chip-a-fg:#5C4310; --chip-n-bg:#EFE6D8; --chip-n-fg:#4A3B30;
  --radius:10px; --shadow:0 1px 2px rgba(61,43,31,.06), 0 2px 8px rgba(61,43,31,.04);
  --head:'DM Sans',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1E1914; --card:#262019; --surface:#2E271F; --text:#F1E9DF; --muted:#B9AD9F;
    --accent:#86D1A8; --accent-hover:#A3DEBE; --on-accent:#12100D; --highlight:#D4A03C; --border:#443A30;
    --chip-g-bg:#24402F; --chip-g-fg:#BFE8D0; --chip-a-bg:#4A3A14; --chip-a-fg:#F3DDA0; --chip-n-bg:#352D25; --chip-n-fg:#E2D8CA;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:4.5rem}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--text);font:1.0625rem/1.6 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--head);letter-spacing:-.01em;margin:0;line-height:1.25}
p{margin:0}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--accent-hover);text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
code{font:.88em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);padding:.05em .35em;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.5rem}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--on-accent);padding:.6rem 1rem;z-index:20;border-radius:0 0 8px 0;font:600 .95rem var(--head)}
.skip:focus{left:0}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3.25rem}
.brand{font:700 1rem var(--head);color:var(--text);text-decoration:none}
.topbar nav{display:flex;gap:1.25rem;font:600 .92rem var(--head)}
.topbar nav a{color:var(--muted);text-decoration:none;padding:.25rem 0;border-bottom:2px solid transparent}
.topbar nav a:hover{color:var(--text);border-bottom-color:var(--highlight)}

/* masthead */
.masthead{padding:3.25rem 0 1.5rem}
.masthead h1{font-size:clamp(2.1rem,4.5vw,2.9rem);font-weight:700}
.lede{font-size:1.25rem;color:var(--muted);margin-top:.5rem;max-width:36rem}
.meta{margin-top:1rem;display:inline-block;font:600 .85rem var(--head);color:var(--muted);border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.2rem .8rem}

/* sections */
section.block{padding:1.75rem 0}
h2{font-size:1.6rem;font-weight:700;margin-bottom:1rem}
.para{max-width:46rem;margin-bottom:1rem}
.checklist{list-style:none;margin:0;padding:0;max-width:46rem;display:grid;gap:.5rem}
.checklist li{position:relative;padding-left:1.6rem}
.checklist li::before{content:"";position:absolute;left:.15rem;top:.62em;width:.5rem;height:.5rem;border-radius:50%;background:var(--highlight)}

/* cards */
.grid{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,29rem),1fr));align-items:stretch}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1.1rem;transition:border-color .15s}
.card:hover,.card:focus-within{border-color:var(--highlight)}
.card-head h3{font-size:1.3rem;font-weight:700}
.tag{color:var(--muted);margin-top:.15rem}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;margin:.75rem 0 0;padding:0}
.chip{font:600 .76rem var(--head);padding:.18rem .6rem;border-radius:999px;letter-spacing:.01em}
.chip-g{background:var(--chip-g-bg);color:var(--chip-g-fg)}
.chip-a{background:var(--chip-a-bg);color:var(--chip-a-fg)}
.chip-n{background:var(--chip-n-bg);color:var(--chip-n-fg)}
.glance{margin:0;display:grid;gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.glance>div{display:grid;grid-template-columns:5rem 1fr;gap:1rem;padding:.55rem 0}
.glance>div+div{border-top:1px solid var(--border)}
dt{font:600 .76rem var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:.25rem}
dd{margin:0;overflow-wrap:anywhere}
.lists{display:grid;gap:1.1rem}
h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.4rem}
.card ul{margin:0;padding-left:1.1rem}
.card ul li{margin:.2rem 0;overflow-wrap:anywhere}
.card ul li::marker{color:var(--highlight)}
.card ul.chips{padding-left:0}
.card ul.chips li{margin:0}
.card ul.chips li::marker{content:""}
.know{background:var(--surface);border-radius:8px;padding:.85rem 1rem}
.credit,.lic{color:var(--muted);font-size:.9rem}
.links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:auto}
.btn{display:inline-flex;align-items:center;min-height:2.5rem;padding:.35rem .9rem;border:1px solid var(--border);border-radius:8px;font:600 .88rem var(--head);text-decoration:none;color:var(--text);background:var(--card)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-main:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}

footer{margin-top:2rem;padding:1.5rem 0 3rem;border-top:1px solid var(--border);color:var(--muted);font-size:.92rem}

@media (max-width:560px){
  .wrap{padding:0 1rem}
  .topbar nav{gap:1.1rem;font-size:.88rem}
  .topbar nav a{white-space:nowrap;padding:.6rem 0}
  .masthead{padding-top:2.25rem}
  .card{padding:1.15rem}
  .glance>div{grid-template-columns:1fr;gap:.1rem}
  .btn{flex:1 1 auto;justify-content:center}
}
@media (max-width:480px){
  .brand{display:none}
  .topbar .wrap{justify-content:flex-start}
}
@media print{
  .topbar,.skip{display:none}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid;border-color:#999}
  .grid{display:block}.card{margin-bottom:1rem}
  .btn{border:none;padding:0;min-height:0}
  .btn::after{content:" (" attr(href) ")";font-weight:400;font-size:.8rem;overflow-wrap:anywhere}
}
</style>
</head>
<body>
<main id="main">
  <div class="wrap">
    <section class="masthead">
      <h1>Page not found</h1>
      <p class="lede">This site is a single page. The link you followed does not go anywhere.</p>
      <p class="para" style="margin-top:1.5rem"><a class="btn btn-main" href="/">Go to Adopt a Dataset</a></p>
    </section>
  </div>
</main>
</body>
</html>
